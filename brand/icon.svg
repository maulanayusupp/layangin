<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512" role="img" aria-label="Layangin app icon">
  <!--
    App icon: the mark on the dusk ground, with padding so a maskable crop on
    Android never clips the sail. Generated sizes come from `pnpm icons`.
  -->
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0.4" y2="1">
      <stop offset="0" stop-color="#0D1430"/>
      <stop offset="0.62" stop-color="#0A0F1F"/>
      <stop offset="1" stop-color="#1B0F24"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.5" cy="0.86" r="0.7">
      <stop offset="0" stop-color="#FF6A2B" stop-opacity="0.42"/>
      <stop offset="1" stop-color="#FF6A2B" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="sail" x1="0.15" y1="0" x2="0.85" y2="1">
      <stop offset="0" stop-color="#FFD98A"/>
      <stop offset="0.38" stop-color="#FFC24B"/>
      <stop offset="0.72" stop-color="#FF6A2B"/>
      <stop offset="1" stop-color="#D1400F"/>
    </linearGradient>
    <linearGradient id="sailShade" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#000000" stop-opacity="0"/>
      <stop offset="1" stop-color="#000000" stop-opacity="0.3"/>
    </linearGradient>
  </defs>

  <rect width="512" height="512" rx="112" fill="url(#bg)"/>
  <rect width="512" height="512" rx="112" fill="url(#glow)"/>

  <!-- Mark scaled to 68% and centred: leaves the safe area a maskable icon needs. -->
  <g transform="translate(256 256) scale(0.68) translate(-256 -256)">
    <path
      d="M256 396 C 268 428, 300 434, 312 458 C 322 478, 350 480, 362 466"
      fill="none"
      stroke="#FF6A2B"
      stroke-width="16"
      stroke-linecap="round"
    />
    <path d="M256 64 L 396 236 L 256 396 L 116 236 Z" fill="url(#sail)"/>
    <path d="M256 64 L 396 236 L 256 396 Z" fill="url(#sailShade)"/>
    <path
      d="M256 64 L 256 396 M116 236 L 396 236"
      stroke="#2A1206"
      stroke-width="13"
      stroke-linecap="round"
    />
    <path d="M150 300 l 22 -22 l 22 22 l -22 22 Z" fill="#35DFC7"/>
    <path d="M318 300 l 22 -22 l 22 22 l -22 22 Z" fill="#35DFC7"/>
  </g>
</svg>
